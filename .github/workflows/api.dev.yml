name: API Deployment (dev)
on:
  push:
    branches:
      - main
      - feat/cloud-run-setup
    paths:
      - .github/workflows/api.dev.yml
      - api/**

jobs:
  Deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Authentication
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: 'github@${{ vars.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-west9-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Push to Artifact Registry
        uses: docker/build-push-action@v4
        with:
          context: api/
          file: api/Dockerfile.preprod
          push: true
          tags: |
            europe-west9-docker.pkg.dev/${{ vars.PROJECT_ID }}/docker/api:${{ github.sha }}
            europe-west9-docker.pkg.dev/${{ vars.PROJECT_ID }}/docker/api:latest